# ld65 config for the VIC-X demos: a BASIC "SYS 2061" stub at $0801
FEATURES {
    STARTADDRESS: default = $0801;
}
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = 2;
    MAIN:     file = %O, start = $0801, size = $8000 - $0801, define = yes;
    BSSMEM:   file = "", start = $8100, size = $1F00;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = BSSMEM,   type = bss, define = yes;
}
